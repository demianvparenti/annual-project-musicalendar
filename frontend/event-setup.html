<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Musicalendar</title>
        <link rel="icon" href="favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="css/w3.css"> 
        <link rel="stylesheet" href="./css/styles.css">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>Musicalendar</h1>
            <nav id="navbar-include"></nav>
        </header>
        </header>
        <main>
            <div class="form-container">
                <h1>Crear Evento</h1>
                <form id="create-event-form" class="event-form">
                    <label for="date">Fecha:</label>
                    <input type="date" id="date" name="date" required>

                    <label for="time">Hora:</label>
                    <input type="time" id="time" name="time" required>

                    <label for="location">Ubicación:</label>
                    <input type="text" id="location" name="location" required>

                    <label for="entry_mode">Modo de Entrada:</label>
                    <select id="entry_mode" name="entry_mode" required>
                        <option value="" disabled selected>Seleccionar</option>
                        <option value="gorra">A la gorra</option>
                        <option value="gratuito">Gratuito</option>
                        <option value="beneficio">Beneficio</option>
                        <option value="arancelado">Arancelado</option>
                    </select>

                    <label for="price">Precio (Opcional):</label>
                    <input type="number" id="price" name="price" step="0.01">

                    <label for="ticket_link">Enlace para Tickets (Opcional):</label>
                    <input type="url" id="ticket_link" name="ticket_link">

                    <label for="flyer_link">Enlace del Flyer (Opcional):</label>
                    <input type="url" id="flyer_link" name="flyer_link">

                    <button type="submit">Crear Evento</button>
                </form>
            </div>
        </main>
        <footer id="footer-include"></footer>
        <script src="./js/eventSetup.js"></script>
        <script src="./js/frontDispatcher.js"></script>
    </body>
</html>
