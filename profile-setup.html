<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Musicalendar</title>
        <link rel="icon" href="favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="css/w3.css"> 
        <link rel="stylesheet" href="./css/styles.css">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>Musicalendar</h1>
            <nav id="navbar-include"></nav>
        </header>
        <main>
            <div class="form-container">
                <h2>Configurar Perfil</h2>
                <form id="profile-setup-form" class="profile-form">
                    <label for="genre">Género musical:</label>
                    <select id="genre" name="genre" required>
                        <option value="" disabled selected>Seleccione un género</option>
                        <option value="Rock">Rock</option>
                        <option value="Pop">Pop</option>
                        <option value="Jazz">Jazz</option>
                        <option value="Classical">Clásico</option>
                        <option value="Hip-Hop">Hip-Hop</option>
                        <option value="Electronic">Electrónica</option>
                        <option value="Country">Tango</option>
                        <option value="Reggae">Reggae</option>
                        <option value="Blues">Blues</option>
                    </select>

                    <label for="photo">Enlace de Foto:</label>
                    <input type="text" id="photo" name="photo" placeholder="https://drive.google.com/..." required>

                    <div class="links-extra">
                        <h3>Enlaces</h3>
                        <button type="button" id="add-link-button">+ Añadir Enlace</button>
                        <div id="links-container"></div>
                    </div>

                    <button type="submit">Guardar Perfil</button>
                </form>
                <div id="profile-success" style="display: none; color: green;">Perfil configurado con éxito.</div>
                <div id="profile-error" style="display: none; color: red;"></div>
                <button id="logout-button" class="w3-btn w3-black">Cerrar Sesión</button>
            </div>
        </main>
        <script type="module" src="./js/profileSetup.js"></script>
        <script src="./js/frontDispatcher.js"></script>  
    </body>
    <footer id="footer-include"></footer>
</html>
