<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Musicalendar</title>
        <link rel="icon" href="favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="css/w3.css"> 
        <link rel="stylesheet" href="./css/styles.css">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <nav id="navbar-include"></nav>
        </header>
        <main id="content-container">
            <aside id="calendar-container">
                <!-- Calendar will be rendered here -->
            </aside>
            <section id="dashboard">
                <h2>Cartelera de Eventos</h2>
                <div id="events-container" class="grid">
                    <!-- Events will be dynamically loaded here -->
                </div>
            </section>
        </main>
        <footer id="footer-include"></footer>
        <script src="./js/frontDispatcher.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    </body>
</html>
