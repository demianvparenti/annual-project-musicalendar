<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Musicalendar</title>
        <link rel="icon" href="favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="css/w3.css"> 
        <link rel="stylesheet" href="./css/styles.css">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <nav id="navbar-include"></nav>
        </header>
        <main>
            <div id="signin-container">
                <section id="hero">
                    <h2>Iniciar sesión</h2>
                </section>
                <form id="signin-form">
                    <label for="username">Nombre de usuario:</label>
                    <input type="text" id="username" name="username" required>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                    <button type="submit" class="w3-btn w3-black">Iniciar sesión</button>
                </form>
                <div id="signin-error" style="display: none; color: red;"></div>
                <div id="signin-success" style="display: none; color: green;">Inicio de sesión exitoso.</div>
                <div id="signup-link">
                    <h3>¿No tienes una cuenta?</h3>
                    <p><a href="./signup.html" class="w3-btn w3-black">Registrarse</a></p>
                </div>
            </div>
        </main>
        <script src="./js/signin.js"></script>
        <script src="./js/frontDispatcher.js"></script>
    </body>
    <footer id="footer-include"></footer>
</html>
